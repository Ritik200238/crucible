# Keep the hosted instance awake.
#
# A free instance scales to zero after an hour without traffic, and the first
# visitor afterwards waits for a cold start. A request every forty minutes is
# enough to keep it up, and it costs nothing on a public repository.
#
# It does nothing until the repository has a CRUCIBLE_URL variable, so a fork
# does not spend its minutes pinging a host that is not theirs. Set it under
# Settings → Secrets and variables → Actions → Variables.
name: keep-warm

on:
  schedule:
    - cron: "*/40 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Wake the instance
        env:
          URL: ${{ vars.CRUCIBLE_URL }}
        run: |
          if [ -z "$URL" ]; then
            echo "No CRUCIBLE_URL variable set. Nothing to keep warm."
            exit 0
          fi
          # The policy endpoint answers without reaching a venue, so a failure
          # here means this instance is down rather than that Binance is.
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 60 "$URL/api/policy")
          echo "GET $URL/api/policy -> $code"
          [ "$code" = "200" ]
